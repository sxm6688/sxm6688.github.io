<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <title>单小蔓 SXM — 手机版</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f3f0e8;
        color: #11110f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 75% 20%, rgba(85, 224, 216, 0.34), transparent 28%),
          #f3f0e8;
      }

      main {
        width: min(100% - 40px, 390px);
        padding: 34px 28px;
        border: 1px solid rgba(17, 17, 15, 0.16);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.46);
      }

      .brand {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .brand span {
        color: #08737a;
      }

      p {
        margin: 16px 0 24px;
        color: #5f5d56;
        font-size: 13px;
        line-height: 1.8;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        padding: 0 20px;
        align-items: center;
        border-radius: 999px;
        background: #11110f;
        color: #f3f0e8;
        font-size: 13px;
        text-decoration: none;
      }
    </style>
    <script>
      (function () {
        const target = new URL("./", window.location.href);
        const params = new URLSearchParams(window.location.search);
        target.searchParams.set("view", "mobile");
        if (params.get("mode") === "edit") target.searchParams.set("mode", "edit");
        target.hash = window.location.hash;
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="brand">SXM<span>.</span></div>
      <p>正在打开单小蔓手机版作品集。</p>
      <a href="./?view=mobile">进入手机版</a>
    </main>
  </body>
</html>
